<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoxSenior - Emissor de Etiquetas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="app-layout">
      <!-- 1. SIDEBAR VERTICAL (CONTROLES) -->
      <aside class="sidebar">
        <!-- Cabeçalho (Logo) -->
        <div class="sidebar-header">
          <div class="logo-icon">🦊</div>
          <h1 class="logo-title">FoxSenior</h1>
        </div>

        <!-- Seção: Arquivos Disponíveis -->
        <div class="sidebar-section file-section">
          <div class="section-header-row">
            <h2 class="section-title">ARQUIVOS DISPONÍVEIS</h2>
            <button
              id="btn-new-file"
              class="btn-new-file"
              title="Criar Novo Template"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Novo</span>
            </button>
          </div>
          <div class="search-wrapper">
            <svg
              class="search-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              type="text"
              id="search-input"
              placeholder="Pesquisar template..."
              class="search-input"
            />
          </div>
          <div class="file-list-container">
            <ul id="file-list" class="file-list">
              <!-- Preenchido dinamicamente -->
            </ul>
          </div>
        </div>

        <!-- Seção: Opções de Impressão -->
        <div class="sidebar-section options-section">
          <h2 class="section-title">OPÇÕES DE IMPRESSÃO</h2>

          <div class="form-group">
            <label for="printer-select">
              <svg
                class="sidebar-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                <path
                  d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"
                ></path>
                <rect x="6" y="14" width="12" height="8"></rect>
              </svg>
              <span>Impressora</span>
            </label>
            <div class="select-wrapper">
              <select id="printer-select">
                <option value="" disabled selected>
                  Buscando impressoras...
                </option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="layout-select">
              <svg
                class="sidebar-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
                <line x1="15" y1="3" x2="15" y2="21"></line>
              </svg>
              <span>Layout (Colunas)</span>
            </label>
            <div class="select-wrapper">
              <select id="layout-select">
                <option value="1" selected>1 Coluna (Individual)</option>
                <option value="2">2 Colunas (Dupla - Lado a Lado)</option>
                <option value="2_refresco">
                  2 Colunas (Faixa Colorida)
                </option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="align-select">
              <svg
                class="sidebar-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="18" y1="10" x2="6" y2="10"></line>
                <line x1="21" y1="6" x2="3" y2="6"></line>
                <line x1="21" y1="14" x2="3" y2="14"></line>
                <line x1="18" y1="18" x2="6" y2="18"></line>
              </svg>
              <span>Alinhamento</span>
            </label>
            <div class="select-wrapper">
              <select id="align-select">
                <option value="L">Esquerda</option>
                <option value="C" selected>Centralizado</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="copies-input">
              <svg
                class="sidebar-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path
                  d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                ></path>
              </svg>
              <span>Cópias</span>
            </label>
            <input
              type="number"
              id="copies-input"
              min="1"
              value="1"
              class="text-center bold-input"
            />
          </div>

          <div class="form-group">
            <label for="darkness-range">
              <svg
                class="sidebar-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 2a10 10 0 0 0 0 20V2z" fill="currentColor"></path>
              </svg>
              <span
                >Escuridão / Contraste:
                <span id="darkness-val" class="bold-text">15</span></span
              >
            </label>
            <input
              type="range"
              id="darkness-range"
              min="0"
              max="30"
              value="15"
              class="slider-input"
            />
          </div>
        </div>

        <!-- Ações do Bottom -->
        <div class="sidebar-actions">
          <button id="btn-save" class="btn btn-secondary">
            <svg
              class="btn-svg-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
              ></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            <span>SALVAR ALTERAÇÕES</span>
          </button>
          <button id="btn-print" class="btn btn-primary">
            <svg
              class="btn-svg-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path
                d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"
              ></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            <span>IMPRIMIR ETIQUETA</span>
          </button>
        </div>
      </aside>

      <!-- 2. ÁREA DE EDIÇÃO E PREVIEW -->
      <main class="main-panel">
        <!-- Painel Superior: Editor -->
        <section class="editor-pane">
          <div class="pane-header">
            <div class="header-controls">
              <div class="font-control-group">
                <label for="font-size-input"
                  >TAMANHO DA FONTE (LINHA ATUAL):</label
                >
                <div class="number-control">
                  <button type="button" class="num-btn" id="font-dec">-</button>
                  <input
                    type="number"
                    id="font-size-input"
                    min="10"
                    max="100"
                    value="25"
                  />
                  <button type="button" class="num-btn" id="font-inc">+</button>
                </div>
              </div>
              <div class="overtype-control-group">
                <label class="toggle-switch">
                  <input type="checkbox" id="chk-overtype" checked />
                  <span class="toggle-slider"></span>
                </label>
                <span class="toggle-text">SOBRESCREVER '_' AO DIGITAR</span>
              </div>
            </div>
            <div id="active-file-indicator" class="active-file-indicator">
              Nenhum arquivo selecionado
            </div>
          </div>

          <div class="editor-wrapper">
            <textarea
              id="label-textarea"
              spellcheck="false"
              placeholder="Selecione um arquivo ou escreva aqui para gerar a etiqueta..."
            ></textarea>
          </div>
        </section>

        <!-- Painel Inferior: Preview -->
        <section class="preview-pane">
          <div class="preview-header">
            <h3>PRÉ-VISUALIZAÇÃO DA ETIQUETA</h3>
          </div>
          <div class="preview-display">
            <div class="canvas-wrapper">
              <canvas id="preview-canvas" width="350" height="350"></canvas>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Modal de Feedback/Status (Opcional, mas muito premium) -->
    <div id="toast" class="toast hidden"></div>
  </body>
</html>
